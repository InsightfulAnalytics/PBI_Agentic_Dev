name: Validate Plugins

on:
  push:
    branches:
      - main
      - 'releases/**'
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'scripts/**'
      - 'LEARNINGS.md'
      - '.github/denylist-*.txt'
      - '.github/workflows/validate-plugins.yml'
  pull_request:
    branches:
      - main
      - 'releases/**'
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'scripts/**'
      - 'LEARNINGS.md'
      - '.github/denylist-*.txt'
      - '.github/workflows/validate-plugins.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    # Always run on this repo; downstream forks opt in via the ENABLE_PLUGIN_CI
    # Actions variable (repo variables don't carry over on fork).
    if: github.repository == 'InsightfulAnalytics/PBI_Agentic_Dev' || vars.ENABLE_PLUGIN_CI == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate plugins
        run: bash scripts/validate-plugins.sh

      # Dated-claim rot, machine-path leakage, the personal-data denylist, and markdown
      # link/anchor resolution. See LEARNINGS.md for the rules these enforce.
      - name: Skill hygiene
        run: python scripts/check-skill-hygiene.py --today "$(date -u +%Y-%m-%d)"

      - name: Boundary rule in sync
        run: python scripts/sync-boundary-rule.py --check
